kind = "mobile"
previewPath = "/"
title = "Huda — AAC App"
version = "1.0.0"
id = "artifacts/huda"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 19558

[services.development]
run = "pnpm --filter @workspace/huda run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/huda", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/huda", "run", "serve" ]

[services.env]
PORT = "19558"
BASE_PATH = "/"
