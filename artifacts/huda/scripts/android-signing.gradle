// Configure generated native code only on the CI runner.
// Never commit a keystore or write passwords into Gradle properties.
gradle.beforeProject { project ->
    project.plugins.withId("com.android.application") {
        project.extensions.getByName("androidComponents").finalizeDsl { android ->
            def mode = System.getenv("ANDROID_SIGNING_MODE")
            def release = android.buildTypes.getByName("release")
            if (mode == "release") {
                def required = [
                    "ANDROID_KEYSTORE_FILE",
                    "ANDROID_KEYSTORE_PASSWORD",
                    "ANDROID_KEY_ALIAS",
                    "ANDROID_KEY_PASSWORD"
                ]
                required.each { name ->
                    if (!System.getenv(name)) {
                        throw new GradleException("Missing required signing environment variable: " + name)
                    }
                }
                def config = android.signingConfigs.findByName("hudaUpload") ?:
                    android.signingConfigs.create("hudaUpload")
                config.storeFile = new File(System.getenv("ANDROID_KEYSTORE_FILE"))
                config.storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
                config.keyAlias = System.getenv("ANDROID_KEY_ALIAS")
                config.keyPassword = System.getenv("ANDROID_KEY_PASSWORD")
                release.signingConfig = config
            } else if (mode == "test") {
                release.signingConfig = android.signingConfigs.getByName("debug")
            } else if (mode == "unsigned") {
                release.signingConfig = null
            } else {
                throw new GradleException("Choose release, test, or unsigned Android signing mode.")
            }
        }
    }
}
